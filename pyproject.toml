[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoskiller"
version = "0.1.0"
description = "Improve agent skills without letting them drift from what they are for."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["anthropic>=1.5"]

[project.scripts]
autoskiller = "autoskiller.cli:main"

[tool.setuptools.packages.find]
include = ["autoskiller*"]
